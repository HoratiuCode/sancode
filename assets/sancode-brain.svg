<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
  <title id="t">SanCode brain</title>
  <desc id="d">The SanCode loop (Setup, Recall, Route, Act, Score, Learn), the three modes, and a SanScore status card.</desc>
  <style>
    .bg{fill:#0a0a0a}
    .panel{fill:#111111;stroke:#ffffff;stroke-opacity:.1}
    .h{font:600 28px -apple-system,'Segoe UI',Inter,sans-serif;fill:#ffffff}
    .sub{font:400 16px -apple-system,'Segoe UI',Inter,sans-serif;fill:#8c8c8c}
    .lbl{font:600 12px ui-monospace,'JetBrains Mono',Menlo,monospace;fill:#707070;letter-spacing:.08em}
    .m{font:400 13.5px ui-monospace,'JetBrains Mono',Menlo,monospace;fill:#f2f2f2;white-space:pre}
    .dim{fill:#707070}
    .ok{fill:#6ee7a0}
    .acc{fill:#ffffff}
    .step{fill:#161616;stroke:#ffffff;stroke-opacity:.14}
    .stepn{font:600 13px ui-monospace,Menlo,monospace;fill:#8c8c8c}
    .stept{font:600 17px -apple-system,'Segoe UI',Inter,sans-serif;fill:#ffffff}
    .stepd{font:400 13px -apple-system,'Segoe UI',Inter,sans-serif;fill:#8c8c8c}
    .arrow{stroke:#5a5a5a;stroke-width:1.5;fill:none}
    .mode{fill:#141414;stroke:#ffffff;stroke-opacity:.12}
    .modet{font:600 15px -apple-system,'Segoe UI',Inter,sans-serif;fill:#ffffff}
    .moded{font:400 13px -apple-system,'Segoe UI',Inter,sans-serif;fill:#8c8c8c}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="660" rx="16"/>

  <!-- Header -->
  <text class="h" x="48" y="66">SanCode — a brain, not a prompt</text>
  <text class="sub" x="48" y="94">One skill for Claude Code, Codex, Hermes, OpenClaw, Claude chat, and Cowork. Remembers, routes, measures, learns.</text>

  <!-- Loop -->
  <text class="lbl" x="48" y="140">EVERY TASK</text>
  <g>
    <rect class="step" x="48"  y="154" width="170" height="86" rx="10"/>
    <text class="stepn" x="64" y="178">0</text><text class="stept" x="84" y="179">Setup</text>
    <text class="stepd" x="64" y="204">first run: your rules,</text>
    <text class="stepd" x="64" y="222">strictness, way of coding</text>

    <rect class="step" x="238" y="154" width="170" height="86" rx="10"/>
    <text class="stepn" x="254" y="178">1</text><text class="stept" x="274" y="179">Recall</text>
    <text class="stepd" x="254" y="204">read brain.md, check</text>
    <text class="stepd" x="254" y="222">what happened to old code</text>

    <rect class="step" x="428" y="154" width="170" height="86" rx="10"/>
    <text class="stepn" x="444" y="178">2</text><text class="stept" x="464" y="179">Route</text>
    <text class="stepd" x="444" y="204">coding, startup,</text>
    <text class="stepd" x="444" y="222">or council</text>

    <rect class="step" x="618" y="154" width="170" height="86" rx="10"/>
    <text class="stepn" x="634" y="178">3</text><text class="stept" x="654" y="179">Act</text>
    <text class="stepd" x="634" y="204">smallest working change,</text>
    <text class="stepd" x="634" y="222">reuse before create</text>

    <rect class="step" x="808" y="154" width="160" height="86" rx="10"/>
    <text class="stepn" x="824" y="178">4</text><text class="stept" x="844" y="179">Score</text>
    <text class="stepd" x="824" y="204">measured from</text>
    <text class="stepd" x="824" y="222">git diff, not guessed</text>

    <rect class="step" x="988" y="154" width="164" height="86" rx="10"/>
    <text class="stepn" x="1004" y="178">5</text><text class="stept" x="1024" y="179">Learn</text>
    <text class="stepd" x="1004" y="204">keep only what changes</text>
    <text class="stepd" x="1004" y="222">the next decision</text>

    <path class="arrow" marker-end="url(#a)" d="M218 197h18"/>
    <path class="arrow" marker-end="url(#a)" d="M408 197h18"/>
    <path class="arrow" marker-end="url(#a)" d="M598 197h18"/>
    <path class="arrow" marker-end="url(#a)" d="M788 197h18"/>
    <path class="arrow" marker-end="url(#a)" d="M968 197h18"/>
    <path class="arrow" marker-end="url(#a)" d="M1070 240v18H323v-16"/>
  </g>

  <!-- Modes -->
  <text class="lbl" x="48" y="300">MODES</text>
  <rect class="mode" x="48" y="314" width="500" height="72" rx="10"/>
  <text class="modet" x="66" y="342">Coding</text>
  <text class="moded" x="66" y="366">Delete before create. Native before package. One file first.</text>

  <rect class="mode" x="48" y="398" width="500" height="72" rx="10"/>
  <text class="modet" x="66" y="426">Startup</text>
  <text class="moded" x="66" y="450">Should this be built? BUILD · VALIDATE FIRST · DON'T BUILD</text>

  <rect class="mode" x="48" y="482" width="500" height="132" rx="10"/>
  <text class="modet" x="66" y="510">Council</text>
  <text class="moded" x="66" y="534">Six seats vote at a real fork, return one decision + kill-switch.</text>
  <text class="m" x="66" y="566">SHIP      <tspan class="acc">#</tspan>         1</text>
  <text class="m" x="66" y="586">SIMPLIFY  <tspan class="acc">###</tspan>       3</text>
  <text class="m" x="66" y="606">KILL      <tspan class="acc">##</tspan>        2</text>

  <!-- SanScore card -->
  <text class="lbl" x="580" y="300">RECAP · VISUAL: CARD</text>
  <rect class="panel" x="580" y="314" width="572" height="300" rx="10"/>
  <circle cx="602" cy="334" r="5" fill="#ff5f57"/>
  <circle cx="620" cy="334" r="5" fill="#febc2e"/>
  <circle cx="638" cy="334" r="5" fill="#28c840"/>
  <text class="m" x="600" y="362"><tspan class="dim">+--------------------------------------------------+</tspan></text>
  <text class="m" x="600" y="379"><tspan class="dim">|</tspan> SanCode recap                    v2.4 - measured <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="396"><tspan class="dim">+--------------------------------------------------+</tspan></text>
  <text class="m" x="600" y="413"><tspan class="dim">|</tspan> Score     [<tspan class="acc">#################</tspan><tspan class="dim">...</tspan>]  89/100  (-_-)  <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="430"><tspan class="dim">|</tspan> Mode      coding                                 <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="447"><tspan class="dim">|</tspan> Task      hard - opus (delegated)                <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="464"><tspan class="dim">|</tspan> Packages  [<tspan class="ok">##########</tspan><tspan class="dim"></tspan>]  0                        <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="481"><tspan class="dim">|</tspan> Files     [<tspan class="ok">#########</tspan><tspan class="dim">.</tspan>]  +1                       <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="498"><tspan class="dim">|</tspan> Lines     [<tspan class="ok">#########</tspan><tspan class="dim">.</tspan>]  +34 / -0                 <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="515"><tspan class="dim">|</tspan> Complex   [<tspan class="ok">########</tspan><tspan class="dim">..</tspan>]  low                      <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="532"><tspan class="dim">|</tspan> Infra     [<tspan class="ok">##########</tspan><tspan class="dim"></tspan>]  none                     <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="549"><tspan class="dim">|</tspan> Trend     72 &gt; 81 &gt; 85 &gt; 89  up                  <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="566"><tspan class="dim">|</tspan> Brain     reuse +1                               <tspan class="dim">|</tspan></text>
  <text class="m" x="600" y="583"><tspan class="dim">+--------------------------------------------------+</tspan></text>
</svg>
